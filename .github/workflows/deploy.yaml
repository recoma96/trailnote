name: CD - Vercel 프로덕션 배포

# GitHub Release가 게시(published)될 때만 실행
# release 이벤트는 tags 필터를 지원하지 않으므로 아래 guard job에서 태그 형식을 검사한다
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # 배포는 순서대로 하나씩 실행하고, 진행 중인 배포는 취소하지 않는다
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: 태그 형식 검사 (v*.*.*)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}

    steps:
      - name: Check tag format
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "::notice::pre-release($TAG)는 배포하지 않습니다."
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::태그($TAG)가 v*.*.* 형식이 아니므로 배포하지 않습니다."
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Vercel 배포
    needs: guard
    if: needs.guard.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel 프로젝트 설정 및 Production 환경변수를 .vercel/ 에 내려받음
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # SSG: 빌드 시점에 S3 JSON을 가져와 모든 코스 페이지를 생성
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATA_API_BASE_URL: ${{ vars.DATA_API_BASE_URL }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 배포 완료: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
